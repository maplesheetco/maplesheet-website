    <!-- Organization + WebSite structured data — sitewide identity. The
         business serves all of Canada (areaServed), so there's deliberately
         no street address or LocalBusiness type, which would tie it to one
         city. Organization data is static here (not
         JS-injected) so it's visible to every crawler regardless of whether
         it executes JavaScript. Per-page schema (Product on Trackers,
         Article on guides) is injected dynamically via useJsonLd in ui.jsx. -->

      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.maplesheet.ca/#organization",
            "name": "MapleSheet Co.",
            "url": "https://www.maplesheet.ca",
            "logo": "https://www.maplesheet.ca/logo.png",
            "email": "hello@maplesheet.ca",
            "description": "Google Sheets investment trackers for Canadian investors in every province and territory: TFSA, RRSP, RESP, FHSA and margin accounts, built around CRA rules.",

            "areaServed": { "@type": "Country", "name": "Canada", "identifier": "CA" },
            "knowsAbout": ["TFSA", "RRSP", "Spousal RRSP", "RESP", "CESG", "FHSA", "Adjusted cost base", "Capital gains tax in Canada"],
            "sameAs": [
              "https://maplesheetco.etsy.com",
              "https://www.youtube.com/@MapleSheetCo",
              "https://x.com/MapleSheetCo"
            ],
            "hasMerchantReturnPolicy": {
              "@type": "MerchantReturnPolicy",
              "applicableCountry": "CA",
              "returnPolicyCategory": "https://schema.org/MerchantReturnNotPermitted"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.maplesheet.ca/#website",
            "name": "MapleSheet Co.",
            "url": "https://www.maplesheet.ca",
            "inLanguage": "en-CA",
            "publisher": { "@id": "https://www.maplesheet.ca/#organization" }
          }
        ]
      }
    </script>
